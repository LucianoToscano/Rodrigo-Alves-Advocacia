name: Recuperar os 72 arquivos V3.3 apenas na branch de revisão
on:
  push:
    branches:
      - chore/recuperacao-v33-20261010
    paths:
      - source/Rodrigo_Alves_V3_3_SITE_FINAL.zip
      - .github/workflows/import-v33.yml
permissions:
  contents: write
jobs:
  importar-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validar ZIP e restaurar site estatico em site/
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c <<'HASH'
          c9f569271a4e7f4d5debcfe632383b8fadedd798860326cd5c9a64a30f2025a1  source/Rodrigo_Alves_V3_3_SITE_FINAL.zip
          HASH
          mkdir -p site
          unzip -q -o source/Rodrigo_Alves_V3_3_SITE_FINAL.zip -d site
          test "$(find site -type f -name '*.html' | wc -l)" -eq 37
          test "$(find site -type f | wc -l)" -eq 72
          test -f site/index.html
          test -f site/seguranca.html
          test -f site/_headers
          test -f site/_redirects
          sha256sum -c <<'FOTOS'
          84ac1ec3bb0051f63fe5b6c433978582989341e2b2a041325f399e790d882499  site/assets/img/rodrigo-hero-v2.webp
          1b19d94494261df7a3bc0c3fb576cc2b817d73defa9f235a8cacd1e258e1dcfc  site/assets/img/rodrigo-mobile-v2.webp
          8bbfeeef72f89e3f9cb5f57f843760053ebf7ecbba7b41b6afdf1f470d4f29fd  site/assets/img/rodrigo-perfil-v2.webp
          FOTOS
          find site/assets/js -name '*.js' -print0 | xargs -0 -r -n1 node --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site
          if git diff --cached --quiet; then
            echo "Arquivos ja presentes sem divergencias."
          else
            git commit -m "site: importar 72 arquivos V3.3 sem modificar fotografias"
            git push origin HEAD:refs/heads/chore/recuperacao-v33-20261010
          fi
